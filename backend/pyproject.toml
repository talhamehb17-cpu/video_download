[project]
name = "lumora-api"
version = "1.0.0"
description = "Lumora API: validates public video links, reads their metadata and prepares permitted downloads."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "S", "ASYNC", "RUF"]
ignore = [
    "S101",    # assert is fine in tests and for type narrowing
    "S603",    # subprocess calls use fixed argument lists, never a shell
    "S607",
    "RUF001",  # typographic characters in user-facing strings are intentional
    "RUF002",
    "RUF003",
    "SIM108",
    "ASYNC109",
    "UP041",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "B011"]
"scripts/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "imageio_ffmpeg"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: starts real worker processes against a local sample source (needs FFmpeg)",
]
filterwarnings = ["ignore::DeprecationWarning:yt_dlp.*"]
