name: CI

on:
  push:
  pull_request:
  schedule:
    # Mondays 06:17 UTC: catches the day a supported site changes and yt-dlp needs updating.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      live_smoke:
        description: Also download from real public sources (Internet Archive, Wikimedia Commons)
        type: boolean
        default: true
      site_check:
        description: Also open the live website in a browser and download a video through it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"] # 3.12 is what the container image runs
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      # Real workers, real yt-dlp and FFmpeg, against a local sample source that
      # serves generated media. No third-party site is contacted.
      - name: Test
        run: python -m pytest

  web:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  image:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag lumora-api backend
      - name: Start
        run: docker run --detach --name api --publish 8000:8000 lumora-api
      - name: Wait until healthy
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health --output health.json 2>/dev/null; then
              cat health.json; echo
              exit 0
            fi
            sleep 1
          done
          echo "The API did not answer within 40 seconds." >&2
          exit 1
      - name: Check the running container
        run: |
          api=http://127.0.0.1:8000
          fail() { echo "::error title=Container image::$1"; exit 1; }
          grep --quiet '"ffmpeg":true' health.json || fail "FFmpeg is not available in the image"
          test "$(docker exec api id -u)" != "0" || fail "the API runs as root"
          docker exec api test -w /srv/data || fail "the data folder is not writable for the API's user"

          config="$(curl --fail --silent $api/api/v1/config)"
          test "$(jq -r .version <<<"$config")" = "$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/__init__.py)" || fail "the image does not run this commit's code"
          test "$(jq -r .sources.mode <<<"$config")" = "platforms" || fail "the default source policy is not 'platforms'"
          test "$(jq -r .capabilities.platform_list <<<"$config")" = "true" || fail "the platform list is not announced"
          test "$(jq -r .limits.max_file_size_bytes <<<"$config")" = "1610612736" || fail "the default size limit is not 1.5 GB"

          platforms="$(curl --fail --silent $api/api/v1/platforms)"
          test "$(jq '[.platforms[] | select(.enabled)] | length' <<<"$platforms")" -ge 30 || fail "fewer than 30 platforms are enabled"
          test "$(jq -r '.platforms[] | select(.id=="netflix") | .enabled' <<<"$platforms")" = "false" || fail "a DRM service is enabled"
          test "$(jq '[.platforms[] | select(.verified)] | length' <<<"$platforms")" = "0" || fail "a platform claims to be verified before any check ran"

          # Refusals that never leave the container: an unlisted website, a DRM service, an internal address.
          answer() { curl --silent -X POST -H 'Content-Type: application/json' --data "{\"url\":\"$1\"}" $api/api/v1/analyze | jq -r .error.code; }
          test "$(answer https://videos.example.org/watch/1)" = "domain_not_allowed" || fail "an unlisted website was not declined"
          test "$(answer https://www.netflix.com/watch/1)" = "platform_unsupported" || fail "a DRM service was not declined"
          test "$(answer http://169.254.169.254/latest/meta-data/)" = "blocked_destination" || fail "an internal address was not blocked"

          # Opening the analyze address in a browser tab is a GET: the answer explains itself.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' $api/api/v1/analyze)" = "405" || fail "GET /analyze is not answered with 405"

          # The admin panel stays off until an administrator is configured.
          test "$(curl --silent $api/api/v1/admin/status | jq -r .configured)" = "false" || fail "the admin panel is on without configuration"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"email":"owner@example.com","password":"x"}' $api/api/v1/admin/login)" = "503" || fail "signing in is possible without configuration"
      - name: Administrator account and settings survive a new container
        run: |
          api=http://127.0.0.1:8001
          fail() { echo "::error title=Container image::$1"; docker logs admin-api 2>&1 | tail -n 40; exit 1; }
          docker volume create lumora-data >/dev/null
          start() {
            docker run --detach --name admin-api --publish 8001:8000 --volume lumora-data:/srv/data \
              --env ADMIN_EMAIL=Owner@Example.com --env ADMIN_BOOTSTRAP_PASSWORD=first-password-123 lumora-api >/dev/null
            for attempt in $(seq 1 40); do curl --fail --silent $api/health >/dev/null 2>&1 && return 0; sleep 1; done
            fail "the API did not start"
          }
          post() { curl --silent -X POST -H 'Content-Type: application/json' --data "$2" "${@:3}" "$api$1"; }
          as_admin() { curl --silent -H "Authorization: Bearer $token" "$@"; }

          start
          token="$(post /api/v1/admin/login '{"email":"owner@example.com","password":"first-password-123"}' | jq -r .token)"
          test "${#token}" -ge 40 || fail "signing in with the initial password failed"
          test "$(as_admin --output /dev/null --write-out '%{http_code}' $api/api/v1/admin/overview)" = "403" || fail "the panel is usable before the initial password is replaced"
          token="$(post /api/v1/admin/password '{"current_password":"first-password-123","new_password":"a much better passphrase"}' -H "Authorization: Bearer $token" | jq -r .token)"
          test "${#token}" -ge 40 || fail "replacing the initial password failed"
          test "$(as_admin $api/api/v1/admin/overview | jq -r .persistent)" = "true" || fail "settings are not being saved to the volume"
          test "$(as_admin -X PATCH -H 'Content-Type: application/json' --data '{"enabled":false}' $api/api/v1/admin/platforms/tiktok | jq -r .enabled)" = "false" || fail "switching a platform off failed"
          test "$(docker exec admin-api stat --format '%a' /srv/data/admin.json)" = "600" || fail "the account file is readable by others"

          docker rm --force admin-api >/dev/null
          start
          test "$(as_admin --output /dev/null --write-out '%{http_code}' $api/api/v1/admin/overview)" = "401" || fail "a session survived the restart"
          test "$(post /api/v1/admin/login '{"email":"owner@example.com","password":"first-password-123"}' | jq -r .error.code)" = "invalid_credentials" || fail "the initial password works again after a restart"
          test "$(post /api/v1/admin/login '{"email":"owner@example.com","password":"a much better passphrase"}' | jq -r .must_change_password)" = "false" || fail "the chosen password was not kept"
          test "$(curl --silent $api/api/v1/platforms | jq -r '.platforms[] | select(.id=="tiktok") | .enabled')" = "false" || fail "the switched-off platform came back on"
          docker rm --force admin-api >/dev/null
          echo "::notice title=Container image::administrator account, password change and platform switches survive a new container"
      - name: Stop cleanly
        run: |
          docker stop -t 25 api
          code="$(docker inspect --format '{{.State.ExitCode}}' api)"
          # 0, or 143 when the server passes SIGTERM on after finishing its own shutdown.
          # 137 would mean it did not stop in time and had to be killed.
          case "$code" in
            0|143) echo "::notice title=Container image::built, healthy, FFmpeg present, non-root, stopped cleanly (exit code $code)" ;;
            *) echo "::error title=Container image::exit code $code after SIGTERM"; exit 1 ;;
          esac
          docker logs api 2>&1 | grep --quiet "temporary files deleted" \
            || { echo "::error title=Container image::the shutdown did not report deleting temporary files"; exit 1; }
      - name: Container logs
        if: always()
        run: docker logs api

  live-smoke:
    name: Real public sources
    # Needs the open internet and depends on third-party sites, so it never runs on
    # ordinary pushes: start it by hand, on the weekly schedule, or by putting
    # "[live-smoke]" in a commit message.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live_smoke) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install
        run: pip install -r requirements-dev.txt
      # 1. analyze -> download the smallest quality -> fetch a subtitle track, for each
      #    example link, with the default production policy. A failure fails the job.
      # 2. The compatibility check of the admin panel for every platform that is switched
      #    on: one public video read per platform, nothing downloaded. This part only
      #    reports what worked from this runner's network address; it never fails the job,
      #    because many platforms turn data-centre addresses away.
      # Results go to the run summary and to annotations on the run page.
      - name: Download from the example sources, then survey the platforms
        run: python scripts/live_smoke.py --survey

  site-check:
    name: Live website
    # Opens the live website in a real browser and downloads a video through it, so
    # it tests what visitors get: the deployed site, the deployed API and the real
    # sources together. Like the job above it never runs on ordinary pushes: start it
    # by hand, on the weekly schedule, or by putting "[site-check]" in a commit
    # message. Only in the repository the site is deployed from, never in forks.
    if: >-
      github.repository == 'talhamehb17-cpu/video_download' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.site_check) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[site-check]'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The address visitors use. Change it here when the site moves.
      SITE_URL: https://lumora-video.vercel.app
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install
        run: npm ci
      # Uses the Chrome that the runner image ships. Results go to the run summary.
      - name: Download a video through the live website
        run: node check-site.mjs "$SITE_URL" --out report
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-website
          path: e2e/report
          if-no-files-found: ignore
          retention-days: 14
