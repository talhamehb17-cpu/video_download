name: CI

on:
  push:
  pull_request:
  schedule:
    # Mondays 06:17 UTC: catches the day a supported site changes and yt-dlp needs updating.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      live_smoke:
        description: Also download from real public sources (Internet Archive, Wikimedia Commons)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"] # 3.12 is what the container image runs
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      # Real workers, real yt-dlp and FFmpeg, against a local sample source that
      # serves generated media. No third-party site is contacted.
      - name: Test
        run: python -m pytest

  web:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  image:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag lumora-api backend
      - name: Start
        run: docker run --detach --name api --publish 8000:8000 lumora-api
      - name: Wait until healthy
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health --output health.json 2>/dev/null; then
              cat health.json; echo
              exit 0
            fi
            sleep 1
          done
          echo "The API did not answer within 40 seconds." >&2
          exit 1
      - name: Check the running container
        run: |
          grep --quiet '"ffmpeg":true' health.json || { echo "::error title=Container image::FFmpeg is not available in the image"; exit 1; }
          test "$(docker exec api id -u)" != "0" || { echo "::error title=Container image::the API runs as root"; exit 1; }
          curl --fail --silent http://127.0.0.1:8000/api/v1/config | grep --quiet '"mode":"allowlist"'
          # A link outside the allow list is refused, an internal address is blocked.
          code() { curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$1" http://127.0.0.1:8000/api/v1/analyze; }
          test "$(code '{"url":"https://www.youtube.com/watch?v=abc"}')" = "422"
          test "$(code '{"url":"http://169.254.169.254/latest/meta-data/"}')" = "422"
      - name: Stop cleanly
        run: |
          docker stop -t 25 api
          code="$(docker inspect --format '{{.State.ExitCode}}' api)"
          # 0, or 143 when the server passes SIGTERM on after finishing its own shutdown.
          # 137 would mean it did not stop in time and had to be killed.
          case "$code" in
            0|143) echo "::notice title=Container image::built, healthy, FFmpeg present, non-root, stopped cleanly (exit code $code)" ;;
            *) echo "::error title=Container image::exit code $code after SIGTERM"; exit 1 ;;
          esac
          docker logs api 2>&1 | grep --quiet "temporary files deleted" \
            || { echo "::error title=Container image::the shutdown did not report deleting temporary files"; exit 1; }
      - name: Container logs
        if: always()
        run: docker logs api

  live-smoke:
    name: Real public sources
    # Needs the open internet and depends on third-party sites, so it never runs on
    # ordinary pushes: start it by hand, on the weekly schedule, or by putting
    # "[live-smoke]" in a commit message.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live_smoke) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install
        run: pip install -r requirements-dev.txt
      # analyze -> download the smallest quality -> fetch a subtitle track, for each
      # example link, with the default production policy. Results go to the run summary.
      - name: Download from the example sources
        run: python scripts/live_smoke.py
